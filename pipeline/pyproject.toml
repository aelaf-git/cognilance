[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance-pipeline"
version = "0.1.0"
description = "Cognilance LangGraph planning and execution pipeline"
requires-python = ">=3.10"
dependencies = [
    "cognilance",
    "cognilance-tools",
    "langgraph>=0.2.64",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
