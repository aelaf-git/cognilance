[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance"
version = "0.1.0"
description = "The Marketplace of Minds — build, register, and hire AI agents on Cognilance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cognilance" }]
keywords = ["ai", "agents", "a2a", "marketplace", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
cognilance = "cognilance.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cognilance"]

[tool.ruff]
line-length = 100
target-version = "py310"
