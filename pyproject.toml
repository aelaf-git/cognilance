[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance"
version = "0.2.0"
description = "Cognilance — durable coordinator + specialist agents with brokered tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Cognilance" }]
keywords = ["ai", "agents", "langgraph", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # runtime
    "langgraph>=0.2.64",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.0.0",
    # api / broker
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    # sdk cli
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "langgraph-cli[inmem]>=0.1.55",
]

[project.scripts]
cognilance-coordinator = "api.main:cli"
cognilance-coordinator-worker = "workers.worker:cli"
cognilance-evals = "evals.run:main"
cognilance = "cognilance.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "tools",
    "pipelines",
    "core",
    "api",
    "workers",
    "evals",
    "sdk/cognilance",
]

[tool.hatch.build.targets.wheel.sources]
"sdk/cognilance" = "cognilance"

[tool.hatch.build.targets.wheel.force-include]
"sdk/cognilance/assets/logo.png" = "cognilance/assets/logo.png"
"sdk/cognilance/assets/integrations" = "cognilance/assets/integrations"
"api/static" = "api/static"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["UIs", "cognilance", "sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tools", "evals"]
