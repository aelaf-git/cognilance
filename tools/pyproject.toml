[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance-tools"
version = "0.1.0"
description = "Cognilance tool router, tool-proxy, and presenters"
requires-python = ">=3.10"
dependencies = [
    "cognilance",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]
