services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    ports:
      - "8200:8200"
    env_file:
      - path: .env
        required: false
    environment:
      COGNILANCE_DEMO: "1"
      COGNILANCE_COORDINATOR_HOST: "0.0.0.0"
      COGNILANCE_COORDINATOR_PORT: "8200"
      COGNILANCE_COORDINATOR_DB: /data/coordinator.db
      COGNILANCE_APPROVAL_GRADES: ${COGNILANCE_APPROVAL_GRADES:-irreversible}
      PYTHONPATH: /app
    volumes:
      - coordinator_data:/data
    develop:
      watch:
        - action: sync
          path: ./sdk
          target: /app/sdk
        - action: sync
          path: ./core
          target: /app/core
        - action: sync
          path: ./tools
          target: /app/tools
        - action: sync
          path: ./pipelines
          target: /app/pipelines
        - action: sync
          path: ./agents
          target: /app/agents
        - action: sync
          path: ./api
          target: /app/api
        - action: sync
          path: ./workers
          target: /app/workers
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./Dockerfile.coordinator

  chat:
    build:
      context: ./UIs/chat
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - path: ./UIs/chat/.env.local
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      COGNILANCE_COORDINATOR_URL: http://coordinator:8200
    depends_on:
      - coordinator
    develop:
      watch:
        - action: sync
          path: ./UIs/chat
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./UIs/chat/package.json
        - action: rebuild
          path: ./UIs/chat/package-lock.json
        - action: rebuild
          path: ./UIs/chat/Dockerfile

volumes:
  coordinator_data:
