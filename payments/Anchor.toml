[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
cognilance_escrow = "4RMjtWR5LStRJu1HacVNpjmNtuhnRvfG2egDpFW9Rc74"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# NOTE: run tests with `anchor test --validator legacy` to use
# solana-test-validator; plain `anchor test` defaults to surfpool.
[test]
startup_wait = 20000

[scripts]
test = "npx mocha --require ts-node/register --extensions ts --timeout 120000 tests/**/*.ts"

[hooks]
