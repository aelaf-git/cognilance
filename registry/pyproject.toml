[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance-registry"
version = "0.1.0"
description = "Production Registry API for the Cognilance AI agent marketplace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "prisma>=0.13.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[project.scripts]
cognilance-registry = "app.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
