services:
  api:
    build: .
    ports:
      - "8088:8080"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/registry.db
      HOST: 0.0.0.0
      PORT: 8080
      HEARTBEAT_TIMEOUT_SECONDS: 90
      STALE_CHECK_INTERVAL_SECONDS: 30
    volumes:
      - registry_sqlite:/data
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./Dockerfile

volumes:
  registry_sqlite:
