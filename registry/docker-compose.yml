services:
  api:
    build: .
    ports:
      - "8088:8080"
    environment:
      DATABASE_URL: file:/app/prisma/dev.db
      HOST: 0.0.0.0
      PORT: 8080
      HEARTBEAT_TIMEOUT_SECONDS: 90
      STALE_CHECK_INTERVAL_SECONDS: 30
    volumes:
      - registry_sqlite:/app/prisma
    command: >
      sh -c "python -m prisma db push --skip-generate --accept-data-loss &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload"
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: sync
          path: ./prisma/schema.prisma
          target: /app/prisma/schema.prisma
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./Dockerfile

volumes:
  registry_sqlite:
