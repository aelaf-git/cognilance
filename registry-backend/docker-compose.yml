# Dev: SQLite only (no Postgres container).
# For PostgreSQL production deploy, see README and docker-compose.postgres.yml

services:
  api:
    build: .
    ports:
      - "8088:8080"
    environment:
      DATABASE_URL: file:/app/prisma/dev.db
      HOST: 0.0.0.0
      PORT: 8080
      BOOTSTRAP_API_KEYS: ${BOOTSTRAP_API_KEYS:-ck-dev-bootstrap-key}
      HEARTBEAT_TIMEOUT_SECONDS: 90
      STALE_CHECK_INTERVAL_SECONDS: 30
    volumes:
      - registry_sqlite:/app/prisma
    command: >
      sh -c "python -m prisma db push --skip-generate --accept-data-loss &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"

volumes:
  registry_sqlite:
