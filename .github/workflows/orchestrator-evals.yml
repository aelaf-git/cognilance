name: orchestrator-evals

on:
  push:
  pull_request:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Orchestrator evals
        run: python -m pytest pipelines/coordinator_board/tests evals/test_orchestrator.py -q --tb=short -s
