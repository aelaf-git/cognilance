[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance-agent-host"
version = "0.1.0"
description = "Developer portal for uploading and hosting Cognilance agents locally"
requires-python = ">=3.10"
dependencies = [
    "cognilance",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "cryptography>=43.0.0",
]

[project.scripts]
cognilance-agent-host = "agent_host.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_host"]
