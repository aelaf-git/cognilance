[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognilance-orchestrator"
version = "0.1.0"
description = "Cognilance orchestrator — skill dispatch and OAuth tools"
requires-python = ">=3.10"
dependencies = [
    "cognilance",
    "cognilance-tools",
    "cognilance-pipeline",
    "langgraph>=0.2.64",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.1.55",
]

[project.scripts]
cognilance-orchestrator = "orchestrator.main:cli"
cognilance-orchestrator-worker = "orchestrator.worker:cli"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
